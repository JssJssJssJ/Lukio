<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lukio – oppimateriaalia</title>
  <meta name="description" content="Lukion matematiikan, fysiikan ja ohjelmoinnin oppimateriaalia.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html">Lukio</a>
      <span class="tagline">Oppimateriaalia lukioon</span>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <p class="eyebrow">Tervetuloa</p>
      <h1>Valitse oppiaine</h1>
      <p class="intro">Täältä löydät lukion oppimateriaalia, esimerkkejä ja harjoituksia.</p>
    </section>

    <section class="subject-grid" aria-label="Oppiaineet">
      <a class="subject-card mathematics" href="matematiikka.html">
        <div class="card-icon">∑</div>
        <div>
          <h2>Matematiikka</h2>
          <p>MAA ja MAB</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="subject-card physics" href="fysiikka.html">
        <div class="card-icon">⚡</div>
        <div>
          <h2>Fysiikka</h2>
          <p>Materiaali tulossa</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>

      <a class="subject-card programming" href="ohjelmointi.html">
        <div class="card-icon">&lt;/&gt;</div>
        <div>
          <h2>Ohjelmointi</h2>
          <p>Materiaali tulossa</p>
        </div>
        <span class="arrow" aria-hidden="true">→</span>
      </a>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">Lukion oppimateriaalia</div>
  </footer>
</body>
</html>
